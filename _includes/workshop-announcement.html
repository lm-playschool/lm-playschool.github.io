<div class="workshop-announcement">
    <h4 class="workshop-date-banner">
        October 28th @
        <img src="{{ "/assets/img/emnlp2026logo.png" | relative_url }}" alt="EMNLP 2026" class="emnlp-logo">
    </h4>

    <h1>Invited Speakers</h1>
    <div class="grid-container speaker-grid-container">
        {%- for speaker in site.data.speakers %}
        <div class="row">
            {% include speaker-card.html speaker=speaker %}
        </div>
        {%- endfor %}
    </div>
    <script>
        // On narrow screens the speaker details are collapsed behind a toggle button (see main.scss).
        (function () {
            var container = document.querySelector('.speaker-grid-container');
            container.classList.add('js-ready');
            container.querySelectorAll('.speaker-toggle').forEach(function (button) {
                button.addEventListener('click', function () {
                    var card = button.closest('.speaker-grid-item');
                    var open = card.classList.toggle('open');
                    button.setAttribute('aria-expanded', open);
                });
            });
        })();
    </script>

    <h1>Schedule</h1>
    {% include schedule-table.html %}

    <hr class="section-divider">
</div>
